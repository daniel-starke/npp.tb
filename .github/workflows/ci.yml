name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Clippy runs the build script, which compiles the resource script with windres.
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-mingw-w64
      # rust-toolchain.toml selects the components and the Windows GNU targets.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo clippy --workspace --all-targets --target i686-pc-windows-gnu -- -D warnings
      - run: cargo test --workspace --features npp-toolbox/pure-rust
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu --features npp-toolbox/pure-rust -- -D warnings
      - run: cargo clippy --workspace --all-targets --target i686-pc-windows-gnu --features npp-toolbox/pure-rust -- -D warnings
      - run: cargo test -p npp-toolbox --no-default-features
      - run: cargo clippy -p npp-toolbox --all-targets --target x86_64-pc-windows-gnu --no-default-features -- -D warnings
      - run: cargo clippy -p npp-toolbox --all-targets --target i686-pc-windows-gnu --no-default-features -- -D warnings

  deploy:
    name: Deploy ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-gnu
          - architecture: x86
            target: i686-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-mingw-w64
      - run: rustup toolchain install
      # Builds the release DLL, rejects imports of non-system DLLs and writes the package folder.
      - run: cargo deploy-${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: NppToolBox-${{ matrix.architecture }}
          path: target/${{ matrix.target }}/package/
