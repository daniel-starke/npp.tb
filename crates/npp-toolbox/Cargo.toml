[package]
name = "npp-toolbox"
description = "NppToolBox: a Notepad++ plugin with text editing helper functions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
build = "build.rs"

[lib]
# Notepad++ loads plugins/<Name>/<Name>.dll, so the library name is the plugin name.
name = "NppToolBox"
crate-type = ["cdylib"]

[dependencies]
npp.workspace = true
unicode-width.workspace = true
pulldown-cmark.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_System_SystemServices",
	"Win32_UI_Controls",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
npp-build.workspace = true

[lints]
workspace = true
