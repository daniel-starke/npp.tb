[package]
name = "npp"
description = "Minimal Notepad++ plugin framework: ABI bindings, Scintilla access and Win32 helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Decodes the raster images of SVGs with resvg's Rust decoders (PNG, JPEG, GIF, WebP) and encodes
# PNG with tiny-skia instead of the Windows Imaging Component.
pure-rust = ["resvg/raster-images"]

[dependencies]
resvg.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows-sys = { workspace = true, features = [
	"Win32_Foundation",
	"Win32_Globalization",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_DataExchange",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_System_Time",
	"Win32_System_WindowsProgramming",
	"Win32_UI_Accessibility",
	"Win32_UI_Controls",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
